# Student Retention Intelligence System - Streamlit Configuration
[theme]
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "8px"
buttonRadius = "8px"
font = "'Inter':https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "'Inter':https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
baseFontSize = 14
baseFontWeight = 400
codeFontSize = "13px"
headingFontSizes = ["30px", "24px", "19px", "16px", "14px", "12px"]
headingFontWeights = [700, 600, 600, 600, 500, 500]
linkUnderline = false
paddingTop = "1.2rem"
paddingBottom = "3rem"

[theme.dark]
primaryColor = "#3B82F6"
backgroundColor = "#0B0F19"
secondaryBackgroundColor = "#131C2E"
codeBackgroundColor = "#1E293B"
textColor = "#F3F4F6"
linkColor = "#60A5FA"
borderColor = "#24324D"
codeTextColor = "#E2E8F0"
greenColor = "#10B981"
redColor = "#EF4444"
yellowColor = "#F59E0B"
orangeColor = "#F97316"
blueColor = "#3B82F6"
violetColor = "#8B5CF6"
grayColor = "#94A3B8"
chartCategoricalColors = [
    "#3B82F6",
    "#10B981",
    "#EF4444",
    "#F59E0B",
    "#8B5CF6",
    "#06B6D4",
    "#EC4899",
    "#64748B"
]
dataframeBorderColor = "#24324D"
dataframeHeaderBackgroundColor = "#131C2E"
dataframeHeaderTextColor = "#F9FAFB"

[theme.dark.sidebar]
backgroundColor = "#070B12"
secondaryBackgroundColor = "#131C2E"
codeBackgroundColor = "#1E293B"
textColor = "#F3F4F6"
borderColor = "#24324D"
primaryColor = "#3B82F6"
linkColor = "#60A5FA"

[theme.light]
primaryColor = "#2563EB"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F8FAFC"
codeBackgroundColor = "#F1F5F9"
textColor = "#0F172A"
linkColor = "#2563EB"
borderColor = "#E2E8F0"
codeTextColor = "#334155"
greenColor = "#059669"
redColor = "#DC2626"
yellowColor = "#D97706"
orangeColor = "#EA580C"
blueColor = "#2563EB"
violetColor = "#7C3AED"
grayColor = "#64748B"

[browser]
gatherUsageStats = false
